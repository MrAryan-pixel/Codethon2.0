server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: itsm-portal-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/itsm_db?createDatabaseIfNotExist=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: your-super-secret-jwt-key-change-in-production-minimum-256-bits-length-here
  expiration: 86400000

logging:
  level:
    root: INFO
    com.itsm: DEBUG
