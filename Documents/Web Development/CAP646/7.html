<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Image Map</title>

 
</head>

<body>

    <h1>🇮🇳 India Image Map</h1>

    <p>Click on different parts of the map:</p>

    <img
        src="indian map.png"
        alt="Map of India"
        usemap="#indiaMap"
        class="india-map"
    >

    <map name="indiaMap">

        <!-- Jammu & Kashmir -->
        <area
        coords="210,80,300,150"
            shape="rect"
            coords="210,80,300,150"
            href="ums.lpu.in"
            alt="Jammu and Kashmir"
            target="_blank"
        >

        <!-- Punjab -->
        <area
        
            shape="rect"
            coords="240,155,300,200"
            href="https://en.wikipedia.org/wiki/Punjab,_India"
            alt="Punjab"
            target="_blank"
        >

        <!-- Rajasthan -->
        <area
            shape="poly"
            coords="190,190,260,180,300,220,270,300,190,290,160,240"
            href="https://en.wikipedia.org/wiki/Rajasthan"
            alt="Rajasthan"
            target="_blank"
        >

        <!-- Uttar Pradesh -->
        <area
            shape="poly"
            coords="330,240,430,230,470,280,400,320,330,300"
            href="https://en.wikipedia.org/wiki/Uttar_Pradesh"
            alt="Uttar Pradesh"
            target="_blank"
        >

        <!-- Bihar -->

            shape="poly"
            coords="430,290,500,280,520,320,450,340"
            href="https://en.wikipedia.org/wiki/Bihar"

            target="_blank"

        <!-- West Bengal -->

            shape="poly"
            coords="510,290,550,300,570,350,530,380,500,340"
            href="https://en.wikipedia.org/wiki/West_Bengal"

            target="_blank"

        <!-- Maharashtra -->

            shape="poly"
            coords="300,400,390,380,430,430,390,480,300,460"
            href="https://en.wikipedia.org/wiki/Maharashtra"

            target="_blank"
        >

        <!-- Karnataka -->

            shape="poly"
            coords="330,470,400,470,410,550,350,580,310,520"
            href="https://en.wikipedia.org/wiki/Karnataka"

            target="_blank"

        <!-- Tamil Nadu -->

            shape="poly"
            coords="390,570,450,550,480,620,430,670,380,620"

    </map>

</html>
