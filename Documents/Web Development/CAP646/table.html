<!doctype html>
<html>

    <title>Student Records</title>
    <style>
      #first-row {
        background-color: lightblue;
        font-family: Georgia, serif;

      .last-row {

    <table border="1">

      </tr>
      <tr>
        <td>Sarah</td>
        <td>MSc</td>

      <tr class="last-row">
        <td>David</td>

        <td>103</td>
      </tr>
    </table>
  </body>
</html>
