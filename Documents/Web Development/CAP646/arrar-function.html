<!-- implement javascript arrow function for array operations -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Operations with Arrow Functions</title>
</head>
<body>
    <h2>Array Operations using Arrow Functions</h2> 
    <p>This page demonstrates the use of arrow functions for array operations in JavaScript.</p>
    <script>
        // Sample array of numbers
        const numbers = [1, 2, 3, 4, 5];

        // Using arrow function to double each number in the array
        const doubledNumbers = numbers.map(num => num * 2);
        console.log('Doubled Numbers:', doubledNumbers);

        // Using arrow function to filter even numbers from the array
        const evenNumbers = numbers.filter(num => num % 2 === 0);
        console.log('Even Numbers:', evenNumbers);

        // Using arrow function to calculate the sum of the array
        const sum = numbers.reduce((accumulator, currentValue) => accumulator + currentValue, 0);
        console.log('Sum of Numbers:', sum);
    </script>
</body>
</html>
