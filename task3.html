<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8"
        <title> Student Registration</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
  height: 100vh;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
}
.glass-card {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  border-radius: 15px;
  padding: 30px;
  width: 100%;
  max-width: 450px;
  color: white;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}
.form-control {
  background: transparent;
  border: none;
  border-bottom: 2px solid white;
  color: white;
}

.form-control:focus {
  box-shadow: none;
  border-color: #00f2fe;
}

.form-control::placeholder {
  color: transparent;
}


.form-group {
  position: relative;
  margin-bottom: 20px;
}

.form-group label {
  position: absolute;
  top: 10px;
  left: 0;
  color: #ccc;
  transition: 0.3s;
}

.form-control:focus + label,
.form-control:not(:placeholder-shown) + label {
  top: -12px;
  font-size: 12px;
  color: #00f2fe;
}


.btn-custom {
  background: linear-gradient(45deg, #00f2fe, #4facfe);
  border: none;
  color: white;
  transition: 0.3s;
}

.btn-custom:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0,242,254,0.7);
}


.alert {
  animation: fadeIn 0.5s ease-in-out;
}

        </style>
    </head>

    <body>
        <div class ="glass-card">
             <h3 class="text-center mb-3">Student Registration 🎓</h3>

  
  <div id="alertBox"></div>

  <form id="studentForm">
    <div class="form-group">
      <input type="text" id="name" class="form-control" placeholder="Name">
      <label>Name</label>
    </div>

    <div class="form-group">
      <input type="text" id="name" class="form-control" placeholder="Name">
      <label>Name</label>
    </div>

    <div class="form-group">
      <input type="text" id="course" class="form-control" placeholder="Course">
      <label>Course</label>
    </div>

    <div class="form-group">
      <input type="password" id="password" class="form-control" placeholder="Password">
      <label>Password</label>
    </div>

    <button type="submit" class="btn btn-custom w-100 mt-3">Register</button>

  </form>

</div>

<script>
document.getElementById("studentForm").addEventListener("submit", function(e){
  e.preventDefault();

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let course = document.getElementById("course").value;
  let password = document.getElementById("password").value;

  let alertBox = document.getElementById("alertBox");

  if(name === "" || email === "" || course === "" || password === ""){
    alertBox.innerHTML = `
      <div class="alert alert-danger">
        ⚠️ All fields are required!
      </div>
    `;
  } else {
    alertBox.innerHTML = `
      <div class="alert alert-success">
        ✅ Student Registered Successfully!
      </div>
    `;

    
    document.getElementById("studentForm").reset();
  }

});

</script>

</body>
</html>
